services:
  # Default: `docker compose up --build` — hot-reload dev server.
  # Bind-mounts the source tree so edits on the host show up immediately.
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  # Optional production-like preview: `docker compose --profile prod up prod --build`
  # Builds the real production bundle and serves it — closest to what ships.
  prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
